<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>La Santa Misa paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Baloo 2",system-ui,sans-serif;
  background:linear-gradient(to bottom,#8FB3E8 0%,#C6D4EE 40%,#F6C89A 100%);
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

.mapa{position:relative;width:100%;height:100dvh;overflow:hidden}
#suelo{position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(to bottom,#E9B98F,#D89E74)}
#camino{position:absolute;inset:0;width:100%;height:100%;z-index:1}

#maria{position:absolute;left:1%;bottom:0;height:44%;z-index:3;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.3));pointer-events:none}
@media (max-width:700px){#maria{height:32%}}

.titulo{position:absolute;top:3%;left:0;right:0;text-align:center;z-index:2;
  font-weight:800;font-size:clamp(1.05rem,3.1vw,1.8rem);color:#2B3E6B;
  text-shadow:0 2px 0 rgba(255,255,255,.6);letter-spacing:-.01em}

#paradas{position:absolute;inset:0;z-index:4}
.parada{position:absolute;transform:translate(-50%,-50%);border:none;padding:0;
  border-radius:50%;cursor:pointer;background:#FFF6E4;overflow:visible;
  display:grid;place-items:center;transition:filter .4s ease}
.parada .disco{width:100%;height:100%;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;background:#FFF6E4;
  box-shadow:0 7px 20px -7px rgba(60,40,10,.6),inset 0 0 0 4px #E8B93E}
.parada img{width:88%;height:88%;object-fit:contain}
.parada.tarjeta .disco{box-shadow:0 7px 20px -7px rgba(60,40,10,.55),inset 0 0 0 4px #9BB0D8;
  background:#EFF3FB}
.parada .num{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);
  font-weight:800;font-size:13px;color:#2B3E6B;opacity:.6}
.parada .marca{position:absolute;right:-4%;bottom:-4%;width:34%;height:34%;
  border-radius:50%;display:grid;place-items:center;opacity:0}
.parada .marca svg{width:64%;height:64%}
.parada.ok .marca{opacity:1;background:#2E9E63}
.parada.cerrada{filter:grayscale(.85) brightness(.82);cursor:default}
.parada.cerrada .marca{opacity:1;background:#6E6A62}
.parada:focus-visible{outline:4px solid #2B3E6B;outline-offset:4px}

#globo{position:absolute;z-index:6;left:50%;top:12%;transform:translateX(-50%);
  max-width:min(70%,500px);background:rgba(255,255,255,.95);color:#1E1A24;
  border-radius:18px;padding:10px 18px;font-size:clamp(14px,2.3vw,18px);
  box-shadow:0 10px 26px -8px rgba(0,0,0,.4);text-align:center}
#globo[hidden]{display:none!important}

#llave{position:absolute;z-index:7;right:0;top:0;width:76px;height:76px;
  cursor:pointer;background:none;border:none;opacity:0}

#panel{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  background:rgba(12,10,8,.72);backdrop-filter:blur(3px)}
#panel[hidden]{display:none!important}
.caja{background:#FFF8EC;border-radius:20px;padding:24px 26px;width:min(88%,380px);
  box-shadow:0 24px 60px -18px rgba(0,0,0,.7);text-align:center}
.caja h2{margin:0 0 4px;font-size:19px;color:#2B3E6B}
.caja p{margin:0 0 14px;font-size:13.5px;color:#6C6560;font-family:system-ui,sans-serif}
#clave{width:100%;font:inherit;font-size:26px;text-align:center;letter-spacing:.4em;
  padding:10px;border:2px solid #DBD5CC;border-radius:12px;background:#fff;color:#1E1A24}
#clave.mal{border-color:#C0392B;animation:no .4s}
@keyframes no{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.acciones{display:flex;gap:9px;margin-top:14px}
.acciones button{flex:1;font:inherit;font-weight:700;font-size:14px;border:none;
  border-radius:11px;padding:11px;cursor:pointer;background:#E8ECF4;color:#2B3E6B}
.acciones button.ok{background:#F5B733;color:#3B2A10}
.estado-libre{margin-top:12px;font-size:12.5px;color:#6C6560;font-family:system-ui,sans-serif}

#tocar{position:absolute;inset:0;z-index:9;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 55%,rgba(20,16,12,.2),rgba(20,16,12,.55));cursor:pointer}
#tocar[hidden]{display:none!important}
#tocar button{width:104px;height:104px;border:none;border-radius:50%;background:#F5B733;
  cursor:pointer;display:grid;place-items:center;box-shadow:0 12px 34px -8px rgba(0,0,0,.75)}
#tocar svg{width:46px;height:46px;margin-left:5px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#8FB3E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="mapa" id="mapa">
  <div id="suelo"></div>
  <svg id="camino" viewBox="0 0 1000 562" preserveAspectRatio="none">
    <path id="senda" fill="none" stroke="#C98F5E" stroke-width="26"
      stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <path id="senda2" fill="none" stroke="#EBC79B" stroke-width="12"
      stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 22" opacity=".8"/>
  </svg>
  <div class="titulo">La Santa Misa paso a paso</div>
  <img id="maria" alt="">
  <div id="globo" hidden></div>
  <div id="paradas"></div>

  <button id="llave" type="button" aria-label="Panel de papá"></button>

  <div id="panel" hidden>
    <div class="caja">
      <h2>Panel de papá</h2>
      <p>Escribe la clave para abrir el juego libre.</p>
      <input id="clave" type="tel" inputmode="numeric" maxlength="4" autocomplete="off"
        aria-label="Clave">
      <div class="acciones">
        <button type="button" id="cerrar">Cerrar</button>
        <button type="button" id="entrar" class="ok">Entrar</button>
      </div>
      <div class="estado-libre" id="estadoLibre"></div>
    </div>
  </div>

  <div id="tocar">
    <button type="button" aria-label="Empezar">
      <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#3B2A10"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const globo=$("globo"), tocar=$("tocar"), caja=$("paradas");
  let audio=null;

  const RUTA=[
    {k:"cap1",    t:"j", img:"cap1",    url:"cap1.html",    n:"Las campanas nos llaman"},
    {k:"puerta",  t:"t", img:null,      url:null,           n:"La puerta de la casa de Dios"},
    {k:"cruz",    t:"j", img:"cruz",    url:"cruz.html",    n:"El agua bendita"},
    {k:"lampara", t:"j", img:"lampara", url:"lampara.html", n:"La lamparita roja"},
    {k:"postura", t:"j", img:"postura", url:"postura.html", n:"Nuestro lugar"},
    {k:"procesion",t:"j",img:null,      url:null,           n:"Entra el padre cantando"},
    {k:"altar",   t:"t", img:null,      url:null,           n:"El padre besa el altar"},
    {k:"padre",   t:"t", img:null,      url:null,           n:"En el nombre del Padre"},
    {k:"saludo",  t:"j", img:null,      url:null,           n:"El Señor esté con ustedes"},
    {k:"perdon",  t:"t", img:null,      url:null,           n:"Perdón, Señor"},
    {k:"piedad",  t:"t", img:null,      url:null,           n:"Señor, ten piedad"},
    {k:"gloria",  t:"j", img:null,      url:null,           n:"Gloria a Dios en el cielo"},
    {k:"oremos",  t:"t", img:null,      url:null,           n:"Oremos y el Amén"},
    {k:"gente",   t:"j", img:"gente",   url:"juego.html",   n:"Llévalos a la misa"},
  ];

  function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function guardar(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  const libre = leer("misa_libre")==="1";

  const FILAS=2, POR=Math.ceil(RUTA.length/FILAS);
  function sitio(i){
    const fila=Math.floor(i/POR), col=i%POR;
    const x=fila%2===0 ? (7 + col*(86/(POR-1))) : (93 - col*(86/(POR-1)));
    const y=fila===0 ? 40 : 74;
    return {x, y:y + Math.sin(col*1.5)*3.4};
  }
  function dibujarSenda(){
    const pts=RUTA.map((_,i)=>{const p=sitio(i);return [p.x*10, p.y*5.62];});
    const d="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join(" L");
    $("senda").setAttribute("d",d); $("senda2").setAttribute("d",d);
  }

  let siguienteEl=null;
  function construir(){
    caja.innerHTML=""; siguienteEl=null;
    let bloqueado=false;
    RUTA.forEach((j,i)=>{
      const hecho = leer("misa_hecho_"+j.k)==="1";
      const listo = !!j.url;

      const cerrada = !libre && bloqueado;
      if(!hecho && !bloqueado) bloqueado=true;

      const p=sitio(i);
      const b=document.createElement("button");
      b.type="button";
      b.className="parada"+(j.t==="t"?" tarjeta":"")+(hecho?" ok":"")+((cerrada||!listo)?" cerrada":"");
      b.style.left=p.x+"%"; b.style.top=p.y+"%";
      b.style.width=b.style.height="clamp(46px,8.4vw,96px)";
      b.setAttribute("aria-label", j.n);

      const disco=document.createElement("div"); disco.className="disco";
      const im=document.createElement("img"); im.alt="";
      if(j.img && IMG[j.img]) im.src=IMG[j.img];
      else im.src = j.t==="t" ? (IMG.tarjeta||"") : (IMG.candado||"");
      disco.appendChild(im); b.appendChild(disco);

      const marca=document.createElement("span"); marca.className="marca";
      marca.innerHTML = hecho
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
      b.appendChild(marca);
      const n=document.createElement("span"); n.className="num"; n.textContent=i+1;
      b.appendChild(n);

      if(listo && !cerrada){
        b.addEventListener("click",()=>ir(j.url));
        if(!hecho && !siguienteEl) siguienteEl=b;
      }
      caja.appendChild(b);
    });
    dibujarSenda();
  }

  function voz(clave, cb){
    if(audio){ audio.onended=null; audio.pause(); }
    const src=SND[clave]; if(!src){ cb&&cb(); return; }
    audio=new Audio(src); audio.onended=()=>{ audio=null; cb&&cb(); };
    audio.play().catch(()=>{ audio=null; cb&&cb(); });
  }
  function decir(txt){
    globo.textContent=txt; globo.hidden=false;
    gsap.fromTo(globo,{opacity:0,y:-8},{opacity:1,y:0,duration:.3});
  }
  function saludar(){
    tocar.hidden=true;
    decir("¡Hola José! ¿Seguimos con la misa?");
    voz("hola", ()=>voz("elige"));
    gsap.fromTo("#maria",{x:-24,opacity:0},{x:0,opacity:1,duration:.6,ease:"power2.out"});
    gsap.fromTo(".parada",{scale:0},{scale:1,duration:.5,stagger:.055,ease:"back.out(1.8)",
      onComplete(){ if(siguienteEl) gsap.to(siguienteEl,{scale:1.12,duration:.9,
        repeat:-1,yoyo:true,ease:"sine.inOut"}); }});
  }
  tocar.addEventListener("pointerdown",e=>{e.preventDefault();saludar();});

  function ir(destino){
    if(audio){ audio.pause(); audio=null; }
    gsap.to("#mapa",{opacity:0,duration:.35,onComplete:()=>{location.href=destino;}});
  }

  const panel=$("panel"), clave=$("clave");
  let temp=null;
  function pintarEstadoLibre(){
    $("estadoLibre").textContent = leer("misa_libre")==="1"
      ? "Juego libre ACTIVADO: José puede entrar a cualquiera."
      : "Juego libre apagado: solo puede la que le toca.";
  }
  $("llave").addEventListener("pointerdown",()=>{
    temp=setTimeout(()=>{ panel.hidden=false; clave.value=""; clave.classList.remove("mal");
      pintarEstadoLibre(); clave.focus(); }, 1600);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>
    $("llave").addEventListener(ev,()=>{ if(temp){clearTimeout(temp);temp=null;} }));
  $("cerrar").addEventListener("click",()=>{ panel.hidden=true; });
  $("entrar").addEventListener("click",()=>{
    if(clave.value.trim()==="1993"){
      const nuevo = leer("misa_libre")==="1" ? "0" : "1";
      guardar("misa_libre", nuevo);
      panel.hidden=true;
      location.reload();
    } else {
      clave.classList.add("mal");
      setTimeout(()=>clave.classList.remove("mal"), 500);
      clave.value="";
    }
  });
  clave.addEventListener("keydown",e=>{ if(e.key==="Enter") $("entrar").click(); });

  if(IMG.maria) $("maria").src=IMG.maria;
  construir();
  addEventListener("resize", dibujarSenda);
})();
</script>
