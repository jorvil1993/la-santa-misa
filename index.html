<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>La Santa Misa paso a paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; font-family:"Baloo 2",system-ui,sans-serif;
  background:linear-gradient(to bottom,#8FB3E8 0%,#C6D4EE 42%,#F6C89A 100%);
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

.mapa{position:relative; width:100%; height:100dvh; overflow:hidden}
#suelo{position:absolute; left:0; right:0; bottom:0; height:34%;
  background:linear-gradient(to bottom,#E9B98F,#D89E74)}
#suelo::before{content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,240,210,.55), transparent 65%)}

#maria{position:absolute; left:3%; bottom:0; height:56%; z-index:3;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.3))}
@media (max-width:700px){ #maria{height:38%; left:1%} }

.titulo{position:absolute; top:4%; left:0; right:0; text-align:center; z-index:2;
  font-weight:800; font-size:clamp(1.3rem,4vw,2.2rem); color:#2B3E6B;
  text-shadow:0 2px 0 rgba(255,255,255,.6); letter-spacing:-.01em}

.fichas{position:absolute; z-index:4; right:5%; top:50%; transform:translateY(-50%);
  display:flex; gap:clamp(18px,4vw,44px); align-items:center}
@media (max-width:700px){
  .fichas{right:auto; left:50%; transform:translate(-40%,-50%); gap:16px}
}
.ficha{width:clamp(110px,21vw,190px); height:clamp(110px,21vw,190px); border:none; padding:0;
  border-radius:50%; cursor:pointer; position:relative; background:#FFF6E4;
  box-shadow:0 10px 30px -8px rgba(60,40,10,.6), inset 0 0 0 7px #E8B93E;
  display:grid; place-items:center; overflow:hidden}
.ficha img{width:74%; height:74%; object-fit:contain}
.ficha .hecho{position:absolute; right:6%; bottom:6%; width:26%; height:26%; opacity:0;
  border-radius:50%; background:#2E9E63; display:grid; place-items:center}
.ficha.ok .hecho{opacity:1}
.ficha .hecho svg{width:62%; height:62%}
.ficha:focus-visible{outline:4px solid #2B3E6B; outline-offset:4px}

#globo{position:absolute; z-index:5; left:50%; top:16%; transform:translateX(-50%);
  max-width:min(72%,520px); background:rgba(255,255,255,.95); color:#1E1A24;
  border-radius:18px; padding:12px 18px; font-size:clamp(15px,2.4vw,19px);
  box-shadow:0 10px 26px -8px rgba(0,0,0,.4); text-align:center}
#globo[hidden]{display:none!important}

#tocar{position:absolute; inset:0; z-index:9; display:grid; place-items:center;
  background:radial-gradient(circle at 50% 55%, rgba(20,16,12,.2), rgba(20,16,12,.55));
  cursor:pointer}
#tocar[hidden]{display:none!important}
#tocar button{width:104px; height:104px; border:none; border-radius:50%; background:#F5B733;
  cursor:pointer; display:grid; place-items:center; box-shadow:0 12px 34px -8px rgba(0,0,0,.75)}
#tocar svg{width:46px; height:46px; margin-left:5px}
</style>
</head>
<body>
<div class="mapa" id="mapa">
  <div id="suelo"></div>
  <div class="titulo">La Santa Misa paso a paso</div>
  <img id="maria" alt="">
  <div id="globo" hidden></div>

  <div class="fichas">
    <button class="ficha" id="f-cap1" type="button" aria-label="Las campanas">
      <img id="i-cap1" alt="">
      <span class="hecho"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
    </button>
    <button class="ficha" id="f-gente" type="button" aria-label="Llévalos a la misa">
      <img id="i-gente" alt="">
      <span class="hecho"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>
    </button>
  </div>

  <div id="tocar">
    <button type="button" aria-label="Empezar">
      <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#3B2A10"/></svg>
    </button>
  </div>
</div>

  $("f-cap1").classList.toggle("ok", hechoCap1);
  $("f-gente").classList.toggle("ok", hechoGente);

  const siguiente = !hechoCap1 ? $("f-cap1") : (!hechoGente ? $("f-gente") : null);
  if(siguiente) gsap.to(siguiente,{scale:1.07,duration:.9,repeat:-1,yoyo:true,ease:"sine.inOut"});

  function voz(clave, cb){
    if(audio){ audio.onended=null; audio.pause(); }
    const src=SND[clave]; if(!src){ cb&&cb(); return; }
    audio=new Audio(src); audio.onended=()=>{ audio=null; cb&&cb(); };
    audio.play().catch(()=>{ audio=null; cb&&cb(); });
  }
  function decir(txt){
    globo.textContent=txt; globo.hidden=false;
    gsap.fromTo(globo,{opacity:0,y:-8},{opacity:1,y:0,duration:.3});
  }

  function saludar(){
    tocar.hidden=true;
    decir("¡Hola José! ¿Qué quieres jugar hoy?");
    voz("hola", ()=>voz("elige"));
    gsap.fromTo("#maria",{x:-24,opacity:0},{x:0,opacity:1,duration:.6,ease:"power2.out"});
    gsap.fromTo(".ficha",{scale:0,rotation:-25},
      {scale:1,rotation:0,duration:.7,stagger:.14,ease:"back.out(1.9)",
       onComplete(){ if(siguiente) gsap.to(siguiente,{scale:1.07,duration:.9,
         repeat:-1,yoyo:true,ease:"sine.inOut"}); }});
  }
  tocar.addEventListener("pointerdown", e=>{ e.preventDefault(); saludar(); });

  function ir(destino){
    if(audio){ audio.pause(); audio=null; }
    gsap.to("#mapa",{opacity:0,duration:.35,onComplete:()=>{ location.href=destino; }});
  }
  $("f-cap1").addEventListener("click", ()=>ir("cap1.html"));
  $("f-gente").addEventListener("click", ()=>ir("juego.html"));
})();
</script>
</body>
</html>
