<title>¿Descansamos o seguimos?</title><style>
html,body{height:100%;margin:0;background:#0B0A08;overscroll-behavior:none}
body{display:grid;place-items:center;overflow:hidden}
.env{max-width:none!important;margin:0!important;padding:0!important;width:auto!important}
.cab,.barra,.notas{display:none!important}
.pantalla{aspect-ratio:16/9!important;
  width:min(100vw, calc(100dvh * 16 / 9))!important;
  height:min(100dvh, calc(100vw * 9 / 16))!important;
  max-width:100vw!important;max-height:100dvh!important;
  border-radius:0!important;box-shadow:none!important}
#pantallaCompleta,#reiniciar,#saltar,#casi,.pruebas{display:none!important}
</style></head><body><title>¿Descansamos o seguimos?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{--papel:#F6F4F0;--sup:#FFF;--borde:#DBD5CC;--tinta:#1E1A24;--tenue:#6C6560;
  --acento:#1E3FA8;--oro:#A8760A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14120F;--sup:#1D1A16;--borde:#38322B;--tinta:#F0EDE8;--tenue:#A39B92;
  --acento:#7E9CF7;--oro:#E3B145}}
:root[data-theme="dark"]{--papel:#14120F;--sup:#1D1A16;--borde:#38322B;--tinta:#F0EDE8;
  --tenue:#A39B92;--acento:#7E9CF7;--oro:#E3B145}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:"Public Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.env{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

.cab{margin-bottom:14px}
.et{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--acento);margin-bottom:6px}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(1.6rem,4.4vw,2.3rem);
  margin:0 0 6px;line-height:1.1}
.sub{color:var(--tenue);font-size:14.5px;margin:0;max-width:66ch}

.pantalla{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:18px;
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  background:radial-gradient(ellipse at 50% 40%,#3A2C20 0%,#201914 70%,#14100C 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.08),0 20px 48px -22px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center}
.pantalla svg.fondo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

#maria{position:absolute;left:4%;bottom:0;height:65%;z-index:5;pointer-events:none;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));will-change:transform,opacity}
@media (max-width:620px){#maria{height:52%;left:2%}}

#globo{position:absolute;z-index:9;left:30%;top:8%;max-width:min(60%,460px);
  background:rgba(255,255,255,.96);color:#1E1A24;border-radius:18px 18px 18px 4px;
  padding:14px 18px;font-family:"Baloo 2",sans-serif;font-size:clamp(15px,2.4vw,20px);
  line-height:1.3;box-shadow:0 10px 28px -8px rgba(0,0,0,.6)}
#globo[hidden]{display:none!important}
#globo .quien{display:block;font-family:"Public Sans",sans-serif;font-size:10px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);margin-bottom:4px}

.opciones{position:relative;z-index:10;display:flex;gap:clamp(20px,5vw,50px);
  align-items:center;justify-content:center;margin-left:clamp(120px,22vw,220px);margin-top:5%}
@media (max-width:620px){
  .opciones{margin-left:clamp(80px,18vw,140px);margin-top:8%;gap:18px}
}

.btn-eleccion{border:none;border-radius:28px;cursor:pointer;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .2s ease,box-shadow .2s ease;will-change:transform}
.btn-eleccion:hover{transform:scale(1.06)}
.btn-eleccion:active{transform:scale(.95)}

.btn-casita{width:clamp(100px,14vw,140px);height:clamp(100px,14vw,140px);
  background:linear-gradient(135deg,#5A3E28,#3D2817);
  box-shadow:0 12px 30px -8px rgba(0,0,0,.7),inset 0 0 0 3px rgba(255,255,255,.15)}
.btn-casita svg{width:clamp(46px,7vw,64px);height:clamp(46px,7vw,64px)}

.btn-seguir{width:clamp(116px,16vw,160px);height:clamp(116px,16vw,160px);
  background:linear-gradient(135deg,#FAD258,#E89F18);
  box-shadow:0 16px 36px -8px rgba(232,159,24,.6),inset 0 0 0 3px rgba(255,255,255,.4)}
.btn-seguir svg{width:clamp(54px,8vw,76px);height:clamp(54px,8vw,76px);margin-left:6px}

.chispa{position:absolute;border-radius:50%;pointer-events:none;z-index:15}

.barra{display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--borde);
  background:var(--sup);color:var(--tinta);border-radius:9px;padding:9px 15px;cursor:pointer}
.estado{margin-left:auto;font-size:12.5px;color:var(--tenue)}

.notas{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:0;margin-top:22px;
  border:1px solid var(--borde);border-radius:12px;overflow:hidden;background:var(--sup)}
.nota{padding:15px 17px;border-right:1px solid var(--borde)}
.nota:last-child{border-right:none}
@media (max-width:760px){.nota{border-right:none;border-bottom:1px solid var(--borde)}
  .nota:last-child{border-bottom:none}}
.nota h3{font-size:13.5px;font-weight:600;margin:0 0 4px}
.nota p{margin:0;font-size:12.5px;color:var(--tenue);line-height:1.5}
</style>

<div class="env">
  

  <div class="pantalla" id="pantalla">
    <svg class="fondo" viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="gluzPausa" cx="50%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#FFE8B0" stop-opacity=".22"/>
          <stop offset="100%" stop-color="#FFE8B0" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="200" cy="110" r="140" fill="url(#gluzPausa)"/>
    </svg>

    <img id="maria" alt="">
    <div id="globo"><span class="quien">María</span><span id="globo-txt">¿Quieres descansar un ratito, o seguimos jugando?</span></div>

    <div class="opciones">
      
      <button class="btn-eleccion btn-casita" id="btnCasita" type="button" aria-label="Volver al camino">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFE9B0" stroke-width="2.3"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11l9-8 9 8"/>
          <path d="M5 10v10h14V10"/>
          <path d="M10 20v-6h4v6"/>
        </svg>
      </button>

      
      <button class="btn-eleccion btn-seguir" id="btnSeguir" type="button" aria-label="Seguir jugando">
        <svg viewBox="0 0 24 24">
          <path d="M6 4l13 8-13 8z" fill="#3B2A10"/>
        </svg>
      </button>
    </div>
  </div>

  

  
</div>

  }

  function brillo(base){
    const c=ac(); if(!c) return; if(c.state==="suspended") c.resume();
    [base||784,(base||784)*1.25].forEach((hz,k)=>{
      const t=c.currentTime+k*.09, o=c.createOscillator(), g=c.createGain();
      o.type="triangle"; o.frequency.value=hz;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+.3);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.32);
    });
  }

  function pose(p){ if(!IMG[p]) return; maria.src=IMG[p]; }

  function hablar(){
    globoTxt.textContent="¿Quieres descansar un ratito, o seguimos jugando?";
    gsap.fromTo(globo,{opacity:0,y:-8,scale:.96},{opacity:1,y:0,scale:1,duration:.3});
    gsap.fromTo(maria,{scaleX:.99,scaleY:1.01},{scaleX:1,scaleY:1,duration:.45,repeat:-1,
      yoyo:true,ease:"sine.inOut",transformOrigin:"bottom center"});
    voz("pausa",()=>{
      gsap.killTweensOf(maria); gsap.set(maria,{scaleX:1,scaleY:1});
    });
  }

  function chispas(el, color){
    const r=el.getBoundingClientRect(), p=pantalla.getBoundingClientRect();
    const cx=r.left+r.width*.5-p.left, cy=r.top+r.height*.5-p.top;
    for(let k=0;k<14;k++){
      const d=document.createElement("div"); d.className="chispa";
      const s=4+Math.random()*6;
      d.style.cssText=`width:${s}px;height:${s}px;left:${cx}px;top:${cy}px;
        background:${color||"#FFD98A"};box-shadow:0 0 10px 3px rgba(255,217,138,.8)`;
      pantalla.appendChild(d);
      const a=Math.random()*Math.PI*2, dd=30+Math.random()*70;
      gsap.to(d,{x:Math.cos(a)*dd,y:Math.sin(a)*dd,opacity:0,scale:.2,
        duration:.8+Math.random()*.4,ease:"power2.out",onComplete:()=>d.remove()});
    }
  }

  gsap.to(btnSeguir,{scale:1.06,duration:.9,repeat:-1,yoyo:true,ease:"sine.inOut"});
  gsap.to(btnCasita,{scale:1.04,duration:1.1,repeat:-1,yoyo:true,ease:"sine.inOut",delay:.3});

  btnCasita.addEventListener("click",()=>{
    ac(); brillo(520); chispas(btnCasita,"#E0AC38");
    gsap.to(btnCasita,{scale:.9,duration:.15,yoyo:true,repeat:1});
    setTimeout(()=>{ location.href="index.html"; }, 350);
  });

  btnSeguir.addEventListener("click",()=>{
    ac(); brillo(880); chispas(btnSeguir,"#FFF3D0");
    gsap.to(btnSeguir,{scale:.9,duration:.15,yoyo:true,repeat:1});
    setTimeout(()=>{ location.href=sigUrl; }, 350);
  });

  if($("oirVoz")) $("oirVoz").addEventListener("click",()=>{ ac(); hablar(); });

  if(IMG.saluda) maria.src = IMG.saluda;
  else if(IMG.presenta) maria.src = IMG.presenta;

  addEventListener("pointerdown",()=>{ ac(); hablar(); },{once:true});

  setTimeout(hablar, 300);
})();
</script>
</body>
</html>
