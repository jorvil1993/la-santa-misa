html,body{height:100%;margin:0;background:#0B0A08;overscroll-behavior:none}
body{display:grid;place-items:center;overflow:hidden}
.env{max-width:none!important;margin:0!important;padding:0!important;width:auto!important}
.cab,.barra,.notas{display:none!important}
.pantalla{aspect-ratio:16/9!important;
  width:min(100vw, calc(100dvh * 16 / 9))!important;
  height:min(100dvh, calc(100vw * 9 / 16))!important;
  max-width:100vw!important;max-height:100dvh!important;

body{-webkit-tap-highlight-color:transparent;user-select:none;font-family:"Public Sans",system-ui,sans-serif}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
.pantalla{position:relative;aspect-ratio:16/9;height:100dvh;width:auto;max-width:100vw;
  max-height:100dvh;overflow:hidden;background:#241C16;touch-action:none;cursor:none}
#fondo{position:absolute;inset:0;width:100%;height:100%}

#canasta{position:absolute;z-index:6;bottom:4%;width:clamp(96px,17vw,210px);
  transform:translateX(-50%);pointer-events:none;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
#canasta svg{width:100%;display:block}
.cae{position:absolute;z-index:5;pointer-events:none;width:clamp(46px,8vw,92px);
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
.cae svg{width:100%;display:block}
.cae.corazon{width:clamp(70px,12vw,140px);filter:drop-shadow(0 0 26px rgba(255,150,120,.9))}

#maria{position:absolute;left:1.5%;bottom:0;height:42%;z-index:7;pointer-events:none;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
@media (max-width:620px){#maria{height:32%}}
#globo{position:absolute;z-index:9;right:2.5%;top:5%;width:min(48%,410px);
  background:rgba(255,255,255,.96);color:#1E1A24;border-radius:16px 16px 16px 4px;padding:12px 15px;
  font-family:"Baloo 2",sans-serif;font-size:clamp(13.5px,2.2vw,17px);line-height:1.32;
  box-shadow:0 10px 26px -8px rgba(0,0,0,.65)}
#globo[hidden]{display:none!important}
#globo .quien{display:block;font-family:"Public Sans",sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:#A8760A;margin-bottom:4px}
#seguir{position:absolute;z-index:10;right:3.5%;bottom:6%;width:70px;height:70px;border:none;
  border-radius:50%;cursor:pointer;padding:0;background:#F5B733;display:grid;place-items:center;
  box-shadow:0 8px 22px -6px rgba(0,0,0,.7)}
#seguir[hidden]{display:none!important}
#seguir svg{width:32px;height:32px}
#casita{position:absolute;z-index:11;right:3%;top:4%;width:46px;height:46px;border:none;
  border-radius:50%;cursor:pointer;padding:0;background:rgba(255,255,255,.9);
  box-shadow:0 5px 14px -4px rgba(0,0,0,.5);display:grid;place-items:center}
#casita svg{width:24px;height:24px}
#cuenta{position:absolute;z-index:9;left:2.5%;top:5%;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.86);border-radius:100px;padding:5px 15px;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(15px,2.4vw,20px);color:#3B2A10}
#cuenta[hidden]{display:none!important}
#insignia{position:absolute;z-index:12;left:50%;top:46%;height:44%;
  transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;
  filter:drop-shadow(0 0 32px rgba(255,214,110,.9))}
.chispa{position:absolute;border-radius:50%;pointer-events:none;z-index:8}
#inicio{position:absolute;inset:0;z-index:14;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 60%,rgba(20,16,12,.32),rgba(20,16,12,.68))}
#inicio[hidden]{display:none!important}
#empezar{width:100px;height:100px;border:none;border-radius:50%;cursor:pointer;background:#F5B733;
  display:grid;place-items:center;box-shadow:0 12px 34px -8px rgba(0,0,0,.8)}
#empezar svg{width:44px;height:44px;margin-left:5px}

<script>
(function(){

  let ctx=null, voz=null, vozTimer=null;
  function ac(){ if(ctx) return ctx;

  function decir(clave, texto, alTerminar){

    const c=ac(); if(!c) return; if(c.state==="suspended") c.resume();
    const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(grave?520:1046,t);
    o.frequency.exponentialRampToValueAtTime(grave?300:660,t+.18);
    g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.16,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+.34);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.36);
  }
  function chispas(px,py,n,color){
    for(let k=0;k<n;k++){
      const d=document.createElement("div"); d.className="chispa";
      const s=4+Math.random()*5;
      d.style.cssText=`width:${s}px;height:${s}px;left:${px}px;top:${py}px;
        background:${color||"#FFE9B0"};box-shadow:0 0 9px 3px rgba(245,183,51,.7)`;
      pantalla.appendChild(d);
      const a=-Math.PI/2+(Math.random()-.5)*2.4, dd=25+Math.random()*60;
      gsap.to(d,{x:Math.cos(a)*dd,y:Math.sin(a)*dd,opacity:0,scale:.25,duration:.8,
        ease:"power2.out",onComplete:()=>d.remove()});
    }
  }
  function mostrarSeguir(fn){
    seguir.hidden=false;
    gsap.fromTo(seguir,{scale:.5,opacity:0},{scale:1,opacity:1,duration:.3,ease:"back.out(2)"});
    gsap.to(seguir,{scale:1.07,duration:.75,repeat:-1,yoyo:true,ease:"sine.inOut",delay:.3});
    seguir.onclick=e=>{e.stopPropagation();gsap.killTweensOf(seguir);seguir.hidden=true;fn();};
  }

  let cx=50;
  function moverCanasta(e){
    const c=pantalla.getBoundingClientRect();
    cx=Math.max(8, Math.min(92, ((e.clientX-c.left)/c.width)*100));
    canasta.style.left=cx+"%";
  }
  pantalla.addEventListener("pointermove",moverCanasta);
  pantalla.addEventListener("pointerdown",moverCanasta);
  canasta.style.left="50%";

  let jugando=false, atrapados=0, quedan=0, corazonPendiente=false;
  const TOTAL=12;

  function soltar(tipo, esCorazon){
    const el=document.createElement("div");
    el.className="cae"+(esCorazon?" corazon":"");
    el.innerHTML = FIGURAS[tipo] || FIGURAS["of-moneda"];
    pantalla.appendChild(el);
    const x=esCorazon ? cx : 12+Math.random()*76;
    el.style.left=x+"%"; el.style.top="-14%";
    const dur=esCorazon?3.4:(2.6+Math.random()*1.1);
    let atrapado=false;
    const t=gsap.to(el,{top:"104%",rotation:(Math.random()-.5)*60,duration:dur,ease:"none",
      onUpdate(){
        if(atrapado) return;
        const c=pantalla.getBoundingClientRect(), r=el.getBoundingClientRect();
        const ey=(r.top+r.height/2-c.top)/c.height*100;
        const ex=(r.left+r.width/2-c.left)/c.width*100;
        if(ey>82 && ey<95 && Math.abs(ex-cx)<9){
          atrapado=true; t.kill();
          const px=c.width*ex/100, py=c.height*ey/100;
          chispas(px,py,esCorazon?18:9, esCorazon?"#FF9B85":"#FFE9B0");
          tin(!esCorazon && tipo==="of-moneda");
          gsap.to(el,{scale:.2,opacity:0,y:20,duration:.3,onComplete:()=>el.remove()});
          gsap.fromTo(canasta,{scale:1},{scale:1.12,duration:.16,yoyo:true,repeat:1});
          atrapados++; $("n").textContent=atrapados;
          if(esCorazon){ jugando=false; esperar(.7,terminar); }
        }
      },
      onComplete(){
        el.remove();

        if(esCorazon && jugando){ jugando=false; esperar(.5,terminar); }
      }});
  }

  function lluvia(){
    quedan=TOTAL;
    for(let i=0;i<TOTAL;i++){
      esperar(.4+i*0.85, ()=>{
        if(!jugando) return;
        soltar(CAEN[Math.floor(Math.random()*CAEN.length)], false);
        quedan--;
        if(quedan===0){
          esperar(2.6, ()=>{
            if(!jugando) return;
            corazonPendiente=true;
            decir("corazon", TEXTOS.corazon, ()=>{ globo.hidden=true; });
            esperar(1.2, ()=>{ if(jugando) soltar("of-corazon", true); });
          });
        }
      });
    }
  }

  function ganarInsignia(){
    const el=$("insignia"); if(!IMG.insignia) return;
    gsap.fromTo(el,{scale:0,rotation:-150,opacity:0},
      {scale:1,rotation:0,opacity:1,duration:1,ease:"back.out(1.7)"});
    gsap.to(el,{rotation:4,duration:2.4,repeat:-1,yoyo:true,ease:"sine.inOut",delay:1});
  }
  function terminar(){
    jugando=false; limpiarCola(); cuenta.hidden=true;
    pantalla.querySelectorAll(".cae").forEach(e=>e.remove());
    try{ localStorage.setItem("misa_hecho_ofrenda","1"); }catch(e){}
    gsap.to(maria,{opacity:1,scale:1,duration:.5});
    pose("celebra"); ganarInsignia();
    decir("fin1", TEXTOS.fin1, ()=>{
      pose("presenta");
      decir("fin2", TEXTOS.fin2, ()=>{
        decir("fin3", TEXTOS.fin3, ()=>{
          pose("senala_lado");
          decir("mision", TEXTOS.mision, ()=>{
            mostrarSeguir(()=>{ location.href="index.html"; });
          });
        });
      });
    });
  }

  function intro(){
    pose("presenta");
    decir("b1", TEXTOS.b1, ()=>mostrarSeguir(()=>{
      pose("senala_arriba");
      decir("b2", TEXTOS.b2, ()=>mostrarSeguir(()=>{
        decir("b3", TEXTOS.b3, ()=>{
          globo.hidden=true; cuenta.hidden=false; atrapados=0; $("n").textContent="0";
          gsap.to(maria,{opacity:.4,scale:.85,duration:.5,transformOrigin:"bottom left"});
          jugando=true; lluvia();
        });
      }));
    }));
  }

  if(IMG.insignia) $("insignia").src=IMG.insignia;
  pose("saluda");
  gsap.to("#empezar",{scale:1.06,duration:.85,repeat:-1,yoyo:true,ease:"sine.inOut"});
  $("inicio").addEventListener("pointerdown",e=>{
    e.preventDefault();
    const c=ac(); if(c&&c.state==="suspended") c.resume();
    gsap.killTweensOf("#empezar");
    gsap.to($("inicio"),{opacity:0,duration:.3,onComplete:()=>{$("inicio").hidden=true;intro();}});
  });
  if($("casita")) $("casita").addEventListener("click",()=>{location.href="index.html";});
})();
</script>

if("serviceWorker" in navigator){addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").catch(function(){});});}
addEventListener("pointerdown",function(){var o=screen.orientation;
  if(o&&o.lock){try{o.lock("landscape").catch(function(){});}catch(e){}}},{once:true});
</script></body></html>
